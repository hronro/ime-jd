name: Release

# Builds the same matrix as build-on-push.yml, but triggers on a version tag
# and uploads the packaged artifacts to a GitHub Release instead of the
# workflow's artifact storage.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Needed for `gh release create` / `gh release upload`.
permissions:
  contents: write

jobs:
  # Create (or reuse) the Release up front so the parallel build jobs can all
  # upload assets into it without racing to create it.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The tag drives the asset filenames; core/build.zig.zon drives the
          # versions embedded in the binaries (Windows DLL, macOS pkg). Fail
          # fast if they disagree so a release can't ship mismatched versions.
          core_ver=$(sed -n 's/.*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' core/build.zig.zon | head -n1)
          if [ "$tag" != "v$core_ver" ]; then
            echo "Tag $tag does not match core/build.zig.zon version (expected v$core_ver)." >&2
            exit 1
          fi
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists — reusing it."
          else
            gh release create "$tag" -R "${{ github.repository }}" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi

  # Zig cross-compiles every libjd target from one x86_64 Linux runner, so all
  # the lib packaging (incl. the Windows .zip) happens here in bash too.
  #   - non-Windows: a .tar.xz per linkage (libjd.so/.dylib and libjd.a),
  #     each bundling include/.
  #   - Windows: one .zip with the DLL, its import lib, the static lib, and
  #     include/ (jd.dll + jd.lib + jd_static.lib share the .lib/.dll space,
  #     so they ride together rather than being split by extension).
  # The intermediate upload-artifact is what the CLI/IME jobs consume.
  build-libs:
    name: libs ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            zig_target: x86_64-linux
          - platform: linux
            arch: arm64
            zig_target: aarch64-linux
          - platform: macos
            arch: x86_64
            zig_target: x86_64-macos.12.0
          - platform: macos
            arch: arm64
            zig_target: aarch64-macos.12.0
          - platform: windows
            arch: x86_64
            zig_target: x86_64-windows-msvc
          - platform: windows
            arch: arm64
            zig_target: aarch64-windows-msvc
          - platform: windows
            arch: x86
            zig_target: x86-windows-msvc
          # iOS device slice — consumed by build-ios to link the .ipa. (iOS only
          # produces a static lib; the simulator slice is a build-on-push concern.)
          - platform: ios
            arch: arm64
            zig_target: aarch64-ios.15.0
          # Android engine slices, consumed by build-android (which links
          # the JNI shim against them with the NDK).
          - platform: android
            arch: arm64
            zig_target: aarch64-linux-android
          - platform: android
            arch: x86_64
            zig_target: x86_64-linux-android
          # WebAssembly reactor module (bin/jd.wasm), consumed by bindings/javascript
          # and any browser/Node host.
          - platform: wasm
            arch: wasm32
            zig_target: wasm32-freestanding
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build libjd
        working-directory: core
        # Non-wasm targets build a static + dynamic lib; the wasm target builds
        # a reactor .wasm. All ship `fast` builds.
        run: zig build -Doptimize=fast -Dtarget=${{ matrix.zig_target }}

      - name: Stage libjd bundle
        shell: bash
        run: |
          set -euo pipefail
          out="dist/libjd-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$out"
          # Keeps zig-out's lib/ + bin/ split (DLLs live in bin/ on Windows).
          cp -R core/zig-out/. "$out/"
          cp -R core/include "$out/include"

      - name: Upload libjd bundle (for CLI/IME jobs)
        uses: actions/upload-artifact@v7
        with:
          name: libjd-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/libjd-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          platform="${{ matrix.platform }}"
          arch="${{ matrix.arch }}"
          bundle="dist/libjd-$platform-$arch"
          out_dir="$PWD/release"
          mkdir -p "$out_dir"
          stage="$(mktemp -d)"
          cp -R "$bundle/include" "$stage/include"

          if [[ "$platform" == "windows" ]]; then
            cp "$bundle/bin/jd.dll" "$bundle/lib/jd.lib" "$bundle/lib/jd_static.lib" "$stage/"
            ( cd "$stage" && zip -r -9 -q "$out_dir/libjd-$ver-windows-$arch.zip" . )
          elif [[ "$platform" == "ios" ]]; then
            # iOS ships only the static lib (no dynamic lib for the App Store sandbox).
            cp "$bundle/lib/libjd.a" "$stage/"
            tar -cf - -C "$stage" libjd.a include | XZ_OPT=-e9 xz -c > "$out_dir/libjd-$ver-ios-$arch.a.tar.xz"
          elif [[ "$platform" == "android" ]]; then
            # Android ships only the dynamic lib, the one the app links its
            # JNI library against (see android/scripts/build-libjd.sh).
            cp "$bundle/lib/libjd.so" "$stage/"
            tar -cf - -C "$stage" libjd.so include | XZ_OPT=-e9 xz -c > "$out_dir/libjd-$ver-android-$arch.so.tar.xz"
          elif [[ "$platform" == "wasm" ]]; then
            # A single self-contained reactor module; ship it alongside include/
            # (the C ABI it exports) as one archive. No arch split — wasm32 is
            # the only slice, so the asset name drops $arch.
            cp "$bundle/bin/jd.wasm" "$stage/"
            tar -cf - -C "$stage" jd.wasm include | XZ_OPT=-e9 xz -c > "$out_dir/libjd-$ver-wasm.wasm.tar.xz"
          else
            case "$platform" in
              linux) dyn="libjd.so";    dynext="so"    ;;
              macos) dyn="libjd.dylib"; dynext="dylib" ;;
            esac
            cp "$bundle/lib/$dyn" "$bundle/lib/libjd.a" "$stage/"
            # XZ_OPT=-e9 → xz extreme preset, level 9 (smallest output).
            tar -cf - -C "$stage" "$dyn"  include | XZ_OPT=-e9 xz -c > "$out_dir/libjd-$ver-$platform-$arch.$dynext.tar.xz"
            tar -cf - -C "$stage" libjd.a include | XZ_OPT=-e9 xz -c > "$out_dir/libjd-$ver-$platform-$arch.a.tar.xz"
          fi
          ls -l "$out_dir"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" -R "${{ github.repository }}" release/* --clobber

  # One CLI build per Rust target. Each downloads the matching prebuilt libs
  # and statically links libjd into jd-cli. Packaged as a .tar.xz (Unix) or
  # .zip (Windows). Linux gnu and musl variants ship as distinct assets.
  build-cli:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: build-libs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux
            arch: x86_64
            suffix: -gnu
            os: linux
            use_cross: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            platform: linux
            arch: x86_64
            suffix: -musl
            os: linux
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux
            arch: arm64
            suffix: -gnu
            os: linux
            use_cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            platform: linux
            arch: arm64
            suffix: -musl
            os: linux
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            platform: macos
            arch: x86_64
            os: macos
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-15
            platform: macos
            arch: arm64
            os: macos
            use_cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            platform: windows
            arch: x86_64
            os: windows
            use_cross: false
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            platform: windows
            arch: arm64
            os: windows
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Download prebuilt libs
        uses: actions/download-artifact@v8
        with:
          name: libjd-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilt-libs

      - name: Build CLI (cross)
        if: matrix.use_cross
        working-directory: cli
        env:
          LIBJD_PATH: ${{ github.workspace }}/prebuilt-libs/lib
        run: cross build --release --target ${{ matrix.target }}

      - name: Build CLI (cargo)
        if: ${{ !matrix.use_cross }}
        working-directory: cli
        env:
          LIBJD_PATH: ${{ github.workspace }}/prebuilt-libs/lib
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage CLI binary
        shell: bash
        run: |
          set -euo pipefail
          out="dist/jd-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.suffix }}"
          mkdir -p "$out"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cp cli/target/${{ matrix.target }}/release/jd-cli.exe "$out/"
          else
            cp cli/target/${{ matrix.target }}/release/jd-cli     "$out/"
          fi

      - name: Package release archive (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          stage="jd-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.suffix }}"
          asset="jd-cli-$ver-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.suffix }}"
          mkdir -p release
          tar -cf - -C "dist/$stage" jd-cli | XZ_OPT=-e9 xz -c > "release/$asset.tar.xz"

      - name: Package release archive (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          $stage = "jd-cli-${{ matrix.platform }}-${{ matrix.arch }}"
          $asset = "jd-cli-$ver-${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/$stage/jd-cli.exe" -DestinationPath "release/$asset.zip" -Force

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" -R "${{ github.repository }}" release/* --clobber

  # One IME build per Windows Rust target. Shipped as a .zip containing the
  # IME DLL, the 32-bit one for 32-bit applications, the user-dictionary
  # window, and the register/unregister/update .bat helpers. The ARM64 .zip
  # has an x64 DLL as well, for the x64 applications ARM64 Windows runs, and
  # the forwarder that hands each application the DLL of its own
  # architecture (windows/forwarder). Before it is shipped, each bundle is
  # installed on its own runner, as a user installs it, the IME created in a
  # process of every architecture that runner runs (windows/check), and
  # uninstalled.
  build-windows-ime:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: build-libs
    strategy:
      fail-fast: false
      matrix:
        include:
          # processes: the kinds of application the runner runs, as the Rust
          # targets the IME and the check are built for.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            arch: x86_64
            processes: x86_64-pc-windows-msvc,i686-pc-windows-msvc
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            arch: arm64
            processes: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc,i686-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.processes }}

      - name: Download prebuilt libs
        uses: actions/download-artifact@v8
        with:
          name: libjd-windows-${{ matrix.arch }}
          path: prebuilt-libs

      - name: Download prebuilt 32-bit libs
        uses: actions/download-artifact@v8
        with:
          name: libjd-windows-x86
          path: prebuilt-libs-x86

      - name: Build IME
        working-directory: windows
        env:
          LIBJD_PATH: ${{ github.workspace }}/prebuilt-libs/lib
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build 32-bit IME DLL
        working-directory: windows
        env:
          LIBJD_PATH: ${{ github.workspace }}/prebuilt-libs-x86/lib
        run: cargo build --release --target i686-pc-windows-msvc -p jd-windows

      - name: Download prebuilt x64 libs
        if: matrix.arch == 'arm64'
        uses: actions/download-artifact@v8
        with:
          name: libjd-windows-x86_64
          path: prebuilt-libs-x64

      - name: Build x64 IME DLL
        if: matrix.arch == 'arm64'
        working-directory: windows
        env:
          LIBJD_PATH: ${{ github.workspace }}/prebuilt-libs-x64/lib
        run: cargo build --release --target x86_64-pc-windows-msvc -p jd-windows

      # ime_jd.dll of the ARM64 bundle, with the resources cargo compiled
      # for the IME's own DLL (windows/build.rs).
      - name: Build the forwarder
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $resources = @(Get-Item "windows/target/${{ matrix.target }}/release/build/jd-windows-*/out/ime_jd.lib")
          if ($resources.Count -ne 1) { throw "Expected one build of the IME DLL's resources, found $($resources.Count)." }
          & windows\forwarder\build.bat $resources[0].FullName

      - name: Stage IME bundle
        shell: bash
        run: |
          set -euo pipefail
          out="dist/jd-ime-windows-${{ matrix.arch }}"
          mkdir -p "$out"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            # The forwarder under the IME's name, and behind it the IME for
            # ARM64 applications and for x64 ones.
            cp windows/target/forwarder/ime_jd.dll "$out/"
            cp windows/target/${{ matrix.target }}/release/ime_jd.dll "$out/ime_jd_arm64.dll"
            cp windows/target/x86_64-pc-windows-msvc/release/ime_jd.dll "$out/ime_jd_x64.dll"
          else
            cp windows/target/${{ matrix.target }}/release/ime_jd.dll "$out/"
          fi
          cp windows/target/i686-pc-windows-msvc/release/ime_jd.dll "$out/ime_jd_x86.dll"
          cp windows/target/${{ matrix.target }}/release/ime_jd_userdict.exe "$out/"
          cp windows/register.bat   "$out/"
          cp windows/unregister.bat "$out/"
          cp windows/update.bat     "$out/"

      # The bundle as a user gets it: installed by its register.bat, the IME
      # created in a process of each kind — through COM, as TSF activates
      # it, and by its registered path, as TSF loads it for its display
      # attributes (windows/check) — and uninstalled by its unregister.bat.
      # A bundle that fails here is not shipped.
      - name: Install the bundle
        shell: cmd
        run: call dist\jd-ime-windows-${{ matrix.arch }}\register.bat < nul

      - name: Create the IME in every kind of process
        working-directory: windows
        shell: pwsh
        run: |
          foreach ($target in '${{ matrix.processes }}'.Split(',')) {
            cargo run --release --target $target -p jd-check
            if ($LASTEXITCODE -ne 0) { throw "ime-jd was not created in a $target process." }
          }

      - name: Uninstall the bundle
        shell: cmd
        run: call dist\jd-ime-windows-${{ matrix.arch }}\unregister.bat < nul

      - name: Find the IME gone from every kind of process
        working-directory: windows
        shell: pwsh
        run: |
          foreach ($target in '${{ matrix.processes }}'.Split(',')) {
            cargo run --release --target $target -p jd-check -- --uninstalled
            if ($LASTEXITCODE -ne 0) { throw "ime-jd is still there for $target processes." }
          }
          if (Test-Path "$env:ProgramW6432\ime-jd") { throw "unregister.bat left files in $env:ProgramW6432\ime-jd." }

      - name: Package release archive
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          $stage = "jd-ime-windows-${{ matrix.arch }}"
          $asset = "jd-ime-$ver-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "release/$asset.zip" -Force

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" -R "${{ github.repository }}" release/* --clobber

  # One IME build per macOS arch, built natively on its own runner. The .pkg
  # installer produced by build-pkg.sh is signed, notarized and shipped.
  build-macos-ime:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: build-libs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download prebuilt libs
        uses: actions/download-artifact@v8
        with:
          name: libjd-macos-${{ matrix.arch }}
          path: prebuilt-libs

      # The .pkg is signed with the Developer ID identities and notarized with
      # the App Store Connect API key upload-ios-appstore uses, so Gatekeeper
      # opens it without a warning. Without the secrets (forks), the .pkg is
      # built unsigned, as on every push. Repo secrets:
      #   MACOS_SIGNING_P12          — Developer ID Application + Developer ID
      #                                Installer identities in one .p12, base64
      #   MACOS_SIGNING_P12_PASSWORD — the .p12 export password
      #   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 — shared with upload-ios-appstore
      - name: Check for signing secrets
        id: guard
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          ASC: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$P12" ] && [ -n "$ASC" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::macOS signing secrets not configured — the .pkg stays unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the Developer ID identities
        if: steps.guard.outputs.sign == 'true'
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_password="$(uuidgen)"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          # -x: the private keys can't be exported again from this keychain.
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -x -A
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$kc" >/dev/null
          # Into the search list, where build-pkg.sh looks them up.
          security list-keychains -d user | xargs security list-keychains -d user -s "$kc"

      - name: Build .pkg installer
        working-directory: macos
        run: >-
          scripts/build-pkg.sh --libjd "${{ github.workspace }}/prebuilt-libs/lib/libjd.a"
          ${{ steps.guard.outputs.sign != 'true' && '--self-sign' || '' }}

      - name: Notarize and staple the .pkg
        if: steps.guard.outputs.sign == 'true'
        working-directory: macos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          pkg=$(echo build/pkg/*.pkg)
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          # Only an Accepted submission gets a ticket to staple; for anything
          # else print Apple's log, which names each rejected file and why.
          xcrun notarytool submit "$pkg" "${auth[@]}" --wait --timeout 30m \
            --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          id=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")
          status=$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            [ -z "$id" ] || xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple "$pkg"
          spctl --assess --type install --verbose=2 "$pkg"

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          mkdir -p release
          # build-pkg.sh emits exactly one jd-ime-macos-<arch>.pkg.
          cp macos/build/pkg/*.pkg "release/jd-ime-$ver-macos-${{ matrix.arch }}.pkg"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" -R "${{ github.repository }}" release/* --clobber

  # The iOS app + keyboard extension, packaged as an UNSIGNED .ipa. Reuses the
  # prebuilt device libjd from build-libs (LIBJD_A, exactly like build-macos-ime).
  # The .ipa is unsigned (public CI has no Apple signing credentials), so users
  # install it with a sideloading tool (AltStore / Sideloadly / TrollStore) that
  # re-signs with their own Apple ID — not by double-clicking.
  build-ios:
    name: ios .ipa
    runs-on: macos-26
    needs: build-libs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download prebuilt libs
        uses: actions/download-artifact@v8
        with:
          name: libjd-ios-arm64
          path: prebuilt-libs

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app (device)
        working-directory: ios
        shell: bash
        # The tag equals v<core/build.zig.zon version> (create-release fails
        # otherwise), so the tag drives the versions baked into the app:
        # CFBundleShortVersionString gets the full version and CFBundleVersion
        # the same numeric code scheme as build-android — monotonic across
        # releases for sideloading tools that compare build numbers.
        # project.yml's 0.0.0 stays the placeholder for plain IDE builds.
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          core="${ver%%[-+]*}"   # strip -prerelease/+build for the numeric code
          IFS=. read -r major minor patch <<<"$core"
          code=$((major * 10000 + minor * 100 + patch))
          xcodebuild build \
            -project JdIME-iOS.xcodeproj -scheme JdIME-iOS \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            LIBJD_A="${{ github.workspace }}/prebuilt-libs/lib/libjd.a" \
            MARKETING_VERSION="$ver" CURRENT_PROJECT_VERSION="$code"

      - name: Package unsigned .ipa
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          app="ios/build/DD/Build/Products/Release-iphoneos/JdIME.app"
          mkdir -p release ipa/Payload
          cp -R "$app" ipa/Payload/
          ( cd ipa && zip -r -9 -q "$GITHUB_WORKSPACE/release/jd-ime-$ver-ios.ipa" Payload )

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" -R "${{ github.repository }}" release/* --clobber

  # The iOS app + keyboard extension, SIGNED and uploaded to App Store Connect
  # (fastlane `release_appstore` lane). Runs on tags ALONGSIDE build-ios — it
  # never touches or replaces the unsigned .ipa, which build-ios still ships for
  # sideloaders. Skips itself cleanly when the App Store secrets are absent (e.g.
  # forks, or PRs from contributors without Apple credentials), so a release is
  # never blocked for lack of signing material.
  #
  # Required repo secrets (base64 the binary ones exactly like build-android's
  # keystore; full setup in ios/README.md → Distribution):
  #   IOS_DIST_CERT_P12      — Apple Distribution certificate (.p12), base64
  #   IOS_DIST_CERT_PASSWORD — the .p12 export password
  #   IOS_PROFILE_APP        — App Store profile for com.hronro.ime-jd, base64
  #   IOS_PROFILE_KEYBOARD   — App Store profile for com.hronro.ime-jd.keyboard, base64
  #   IOS_TEAM_ID            — 10-character Apple Developer Team ID
  #   ASC_KEY_ID             — App Store Connect API key ID
  #   ASC_ISSUER_ID          — App Store Connect API issuer ID
  #   ASC_KEY_P8             — the API key (.p8), base64
  #
  # The store build uses the Xcode the app is developed and tested with, 27.2.
  # setup-xcode can only pick among the Xcodes the image ships: macos-26 has
  # none newer than 26.x, and the xcode-27 image defaults to 27.1.
  upload-ios-appstore:
    name: iOS App Store upload
    runs-on: xcode-27
    needs: build-libs
    steps:
      # Secrets can't be read in a job-level `if:`, so gate every step on a
      # presence check instead. No secrets → notice + no-op (release stays green
      # and build-ios still publishes the unsigned .ipa).
      - name: Check for App Store signing secrets
        id: guard
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          ASC: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$ASC" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::iOS App Store secrets not configured — skipping upload" \
              "(build-ios still publishes the unsigned .ipa)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Select Xcode
        if: steps.guard.outputs.enabled == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Install XcodeGen
        if: steps.guard.outputs.enabled == 'true'
        run: brew install xcodegen

      - name: Download prebuilt libs
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: libjd-ios-arm64
          path: prebuilt-libs

      - name: Generate Xcode project
        if: steps.guard.outputs.enabled == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Build, sign & upload to App Store Connect
        if: steps.guard.outputs.enabled == 'true'
        working-directory: ios
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_KEYBOARD: ${{ secrets.IOS_PROFILE_KEYBOARD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          LIBJD_A: ${{ github.workspace }}/prebuilt-libs/lib/libjd.a
        # Version/build match build-ios exactly: the full version drives
        # CFBundleShortVersionString, the build-android numeric code drives
        # CFBundleVersion. NOTE: re-uploading the SAME marketing version to App
        # Store Connect needs a HIGHER build number — bump the tag's patch, or
        # override CURRENT_PROJECT_VERSION, before re-running.
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          core="${ver%%[-+]*}"   # strip -prerelease/+build for the numeric code
          IFS=. read -r major minor patch <<<"$core"
          export JD_MARKETING_VERSION="$ver"
          export JD_BUILD_NUMBER="$((major * 10000 + minor * 100 + patch))"
          fastlane release_appstore

  # Android app + IME service, one APK per ABI (arm64-v8a + x86_64). Reuses
  # the prebuilt engine slices from build-libs via the script's LIBJD_SO_DIR
  # fast-path (like build-ios's LIBJD_A); only the JNI shim is linked here,
  # by the NDK, so the job needs no zig. The APKs' versionName/Code come
  # from the tag (which create-release verified against core/build.zig.zon).
  # -PjdAutoUpdate=true bakes in the in-app updater (daily release-feed
  # check + download/install, with the INTERNET and REQUEST_INSTALL_PACKAGES
  # permissions it needs): these APKs are distributed here, on GitHub, so
  # they have to find their own updates. App-store builds omit the flag —
  # see android/app/build.gradle.kts.
  #
  # Android refuses to install unsigned APKs, so the assets are signed with
  # the keystore from repo secrets:
  #   ANDROID_SIGNING_KEYSTORE — base64 of a .jks holding ONE key
  #                              (apksigner then needs no alias)
  #   ANDROID_SIGNING_PASSWORD — its store/key password
  # Until those are configured, the job falls back to an ephemeral
  # CI-generated key with a warning: the APKs install fine, but every
  # release gets a different signature, so users must uninstall to upgrade.
  build-android:
    name: android .apk
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Download prebuilt engine (arm64)
        uses: actions/download-artifact@v8
        with:
          name: libjd-android-arm64
          path: prebuilt-raw/arm64

      - name: Download prebuilt engine (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: libjd-android-x86_64
          path: prebuilt-raw/x86_64

      - name: Stage engines by ABI
        shell: bash
        # build-libjd.sh expects LIBJD_SO_DIR/<abi>/libjd.so, keyed by the
        # Android ABI names rather than the artifact arch names.
        run: |
          set -euo pipefail
          mkdir -p prebuilt/arm64-v8a prebuilt/x86_64
          cp prebuilt-raw/arm64/lib/libjd.so  prebuilt/arm64-v8a/
          cp prebuilt-raw/x86_64/lib/libjd.so prebuilt/x86_64/

      - name: Build release APKs
        working-directory: android
        shell: bash
        env:
          LIBJD_SO_DIR: ${{ github.workspace }}/prebuilt
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          core="${ver%%[-+]*}"   # strip -prerelease/+build for the numeric code
          IFS=. read -r major minor patch <<<"$core"
          code=$((major * 10000 + minor * 100 + patch))
          ./gradlew assembleRelease -PjdVersionName="$ver" -PjdVersionCode="$code" -PjdAutoUpdate=true

      - name: Sign APKs
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > signing.jks
            pass="$KEYSTORE_PASS"
          else
            echo "::warning::ANDROID_SIGNING_KEYSTORE secret not set — signing" \
              "with an ephemeral key; users must uninstall to upgrade across releases."
            keytool -genkeypair -keystore signing.jks -storepass ci-ephemeral \
              -alias ci -dname "CN=ime-jd CI" -keyalg RSA -keysize 2048 -validity 10000
            pass=ci-ephemeral
          fi
          bt=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p release
          for pair in "arm64-v8a:arm64" "x86_64:x86_64"; do
            abi="${pair%%:*}" arch="${pair##*:}"
            unsigned="android/app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
            "$bt/zipalign" -f 4 "$unsigned" "aligned-$abi.apk"
            # --v4-signing-enabled false: v4 emits a detached <apk>.idsig used
            # only for incremental `adb install`, useless for a downloaded APK.
            # Without this, apksigner writes it next to --out and the upload
            # glob below publishes it as a stray release asset. v2/v3 (embedded)
            # stay on by default and are what installs actually verify.
            "$bt/apksigner" sign --ks signing.jks --ks-pass "pass:$pass" \
              --v4-signing-enabled false \
              --out "release/jd-ime-${GITHUB_REF_NAME}-android-$arch.apk" "aligned-$abi.apk"
          done

      - name: Stage R8 mapping
        shell: bash
        # The APKs are minified, so crash traces are obfuscated without this
        # mapping. One file covers both APKs — the ABI splits share identical
        # bytecode, only the packaged libjd.so differs.
        run: |
          set -euo pipefail
          cp android/app/build/outputs/mapping/release/mapping.txt \
            "release/jd-ime-${GITHUB_REF_NAME}-android-mapping.txt"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        # Scope to *.apk plus the explicitly named mapping (not release/*):
        # this is the one job whose signing tool writes sibling files, and
        # apksigner's v4 default has drifted across build-tools versions — pin
        # the asset set so a future default flip can't leak a stray .idsig again.
        run: |
          gh release upload "${GITHUB_REF_NAME}" -R "${{ github.repository }}" \
            release/*.apk \
            "release/jd-ime-${GITHUB_REF_NAME}-android-mapping.txt" \
            --clobber

  # The Linux IME, one build per libc and arch, each in the oldest distro it
  # targets so it runs on every newer one: Ubuntu 22.04 for glibc (a .deb, an
  # .rpm and an Arch package per framework and for the user-dictionary
  # editor, and the generic tarball), Alpine 3.22 for musl (an .apk for
  # each). linux/packaging/build.sh builds, runs the shared layer's and the
  # editor's tests, and packages; build-on-push.yml installs each package on
  # a clean system and runs it end to end. The .rpm and the .apk are signed
  # with the package repositories' keys (linux/repo), repository secrets.
  build-linux-ime:
    name: linux-ime ${{ matrix.libc }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-libs
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            arch: x86_64
            runner: ubuntu-latest
            image: docker.io/library/ubuntu:22.04
          - libc: glibc
            arch: arm64
            runner: ubuntu-24.04-arm
            image: docker.io/library/ubuntu:22.04
          - libc: musl
            arch: x86_64
            runner: ubuntu-latest
            image: docker.io/library/alpine:3.22
          - libc: musl
            arch: arm64
            runner: ubuntu-24.04-arm
            image: docker.io/library/alpine:3.22
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download prebuilt libs
        uses: actions/download-artifact@v8
        with:
          name: libjd-linux-${{ matrix.arch }}
          path: prebuilt-libs

      - name: Install nfpm
        run: linux/scripts/install-nfpm.sh "$RUNNER_TEMP/bin"

      - name: Build packages
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
          ALPINE_APK_SIGNING_KEY: ${{ secrets.ALPINE_APK_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "$PACKAGES_GPG_KEY" ] || [ -z "$ALPINE_APK_SIGNING_KEY" ]; then
            echo "The repository has no package signing keys: see linux/README.md, Repositories." >&2
            exit 1
          fi
          mkdir -p release
          keys=$(mktemp -d)
          printf '%s\n' "$PACKAGES_GPG_KEY" > "$keys/gpg.asc"
          printf '%s\n' "$ALPINE_APK_SIGNING_KEY" > "$keys/ime-jd.rsa"
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/prebuilt-libs:/libjd:ro" -v "$PWD/release:/dist" \
            -v "$RUNNER_TEMP/bin/nfpm:/usr/local/bin/nfpm:ro" -v "$keys:/keys:ro" \
            -e IMEJD_RPM_KEY=/keys/gpg.asc -e IMEJD_APK_KEY=/keys/ime-jd.rsa -e NFPM_RPM_PASSPHRASE \
            ${{ matrix.image }} sh -euc '
              /src/linux/scripts/install-deps.sh build
              /src/linux/packaging/build.sh /dist /libjd/lib/libjd.a'
          rm -rf "$keys"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" -R "${{ github.repository }}" release/* --clobber

  # 键道's package repositories (linux/repo): their index files, listing every
  # published release's packages, signed, and committed to the `packages`
  # branch, which starts from the initial commit and so holds no code. The
  # Worker at ime-jd-repo.hronro.com serves them, and the packages from the
  # releases themselves. Pre-releases, marked so or tagged with a suffix such
  # as -rc1, stay out: apt and the rest would offer them to everyone.
  publish-linux-repos:
    name: linux repositories
    runs-on: ubuntu-latest
    needs: build-linux-ime
    concurrency:
      group: packages-branch
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The initial commit, and the packages branch if there is one.
          fetch-depth: 0

      - name: Download every release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[]
              | select((.draft or .prerelease or (.tag_name | contains("-"))) | not)
              | select(any(.assets[]; .name | test("^jd-ime-v.*-(linux-.*[.](deb|rpm)|alpine-.*[.]apk)$")))
              | .tag_name' |
            while IFS= read -r tag; do
              gh release download "$tag" -R "${{ github.repository }}" -D "$RUNNER_TEMP/assets/$tag" \
                -p 'jd-ime-v*-linux-*.deb' -p 'jd-ime-v*-linux-*.rpm' -p 'jd-ime-v*-alpine-*.apk'
            done
          find "$RUNNER_TEMP/assets" -type f | sort

      - name: Build the index files
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
          ALPINE_APK_SIGNING_KEY: ${{ secrets.ALPINE_APK_SIGNING_KEY }}
        run: |
          set -eu
          keys=$(mktemp -d)
          printf '%s\n' "$PACKAGES_GPG_KEY" > "$keys/gpg.asc"
          printf '%s\n' "$ALPINE_APK_SIGNING_KEY" > "$keys/ime-jd.rsa"
          # The branch as the last release left it; nothing before the first.
          mkdir "$RUNNER_TEMP/branch"
          if git rev-parse --verify -q origin/packages >/dev/null; then
            git archive origin/packages | tar -x -C "$RUNNER_TEMP/branch"
          fi
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/work" -v "$keys:/keys:ro" \
            -e GPG_KEY=/keys/gpg.asc -e GPG_PASSPHRASE docker.io/library/debian:13 sh -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                apt-utils createrepo-c gnupg rpm xz-utils >/dev/null
              /src/linux/repo/indexes.sh apt /work/assets /work/branch /work/tree
              /src/linux/repo/indexes.sh rpm /work/assets /work/branch /work/tree'
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/work" -v "$keys:/keys:ro" \
            -e APK_KEY=/keys/ime-jd.rsa docker.io/library/alpine:3.22 sh -euc '
              apk add --no-cache abuild openssl >/dev/null
              /src/linux/repo/indexes.sh apk /work/assets /work/branch /work/tree'
          rm -rf "$keys"

      - name: Commit to the packages branch
        run: |
          set -eu
          # On top of the branch, or, the first time, of the initial commit,
          # which has no files.
          parent=$(git rev-parse --verify -q origin/packages || git rev-list --max-parents=0 HEAD | tail -n 1)
          export GIT_INDEX_FILE="$RUNNER_TEMP/index"
          git --git-dir="$PWD/.git" --work-tree="$RUNNER_TEMP/tree" -C "$RUNNER_TEMP/tree" add -A .
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
            echo "The index files have not changed."
            exit 0
          fi
          commit=$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -p "$parent" -m "Index files for ${GITHUB_REF_NAME}")
          git push origin "${commit}:refs/heads/packages"

  # 键道 in the AUR, where Arch users look for it: ime-jd-bin, whose split
  # packages are this release's own Arch packages under the AUR's names
  # (linux/repo/aur.sh), pushed with the AUR account's SSH key, a repository
  # secret. Pre-releases, tagged with a suffix such as -rc1, stay out.
  publish-aur:
    name: aur
    runs-on: ubuntu-latest
    needs: build-linux-ime
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the Arch packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" -R "${{ github.repository }}" -D "$RUNNER_TEMP/assets" \
            -p 'jd-ime-*-linux-*.pkg.tar.zst'

      - name: Write the PKGBUILD
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/work" docker.io/library/archlinux:latest \
            /src/linux/repo/aur.sh "${GITHUB_REF_NAME}" /work/assets /work/aur
          cat "$RUNNER_TEMP/aur/PKGBUILD"

      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The AUR's own host key, as it publishes it:
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git clone ssh://aur@aur.archlinux.org/ime-jd-bin.git "$RUNNER_TEMP/aur-git"
          cp "$RUNNER_TEMP/aur/PKGBUILD" "$RUNNER_TEMP/aur/.SRCINFO" "$RUNNER_TEMP/aur-git/"
          cd "$RUNNER_TEMP/aur-git"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR has this release already."
            exit 0
          fi
          git -c user.name=hronro -c user.email=hronro@gmail.com commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master
