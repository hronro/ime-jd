name: Tests

# The merge gate: runs every test suite in the repo. Kept separate from
# build-on-push.yml (which produces artifacts on master pushes) so branch
# protection can require these checks on PRs without coupling them to the
# artifact builds. No `paths` filtering — a path-filtered workflow never
# starts, which leaves its required checks "Expected" forever and blocks
# the merge.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on force-pushes / new PR commits.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Zig engine: unit + integration tests, including the generator parsers
  # and the end-to-end tests against the real embedded blobs — then again as
  # libjd-engine, built without the embedded dictionary, where the tests
  # that type on it skip and the ones for a host's own dictionary run.
  test-core:
    name: core (zig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run core tests
        working-directory: core
        run: zig build test --summary all

      - name: Run core tests (libjd-engine)
        working-directory: core
        run: zig build test -Dbuiltin_dict=false --summary all

  # JavaScript bindings: type-check the hand-written .d.ts, then drive the real
  # engine through the wasm C ABI in Node. `npm test`'s pretest zig-builds core
  # to wasm32-freestanding first, so this job needs both zig and node.
  test-js:
    name: js (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # 24 is the current Node LTS. `node --test` runs the plain-JS tests
      # directly (no type-stripping); 24 also covers the engine's `using` support.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dev dependencies
        working-directory: bindings/javascript
        run: npm ci

      - name: Type-check
        working-directory: bindings/javascript
        run: npm run typecheck

      - name: Run binding tests
        working-directory: bindings/javascript
        run: npm test

      # The host-dictionary tests again, on the wasm built without the
      # embedded dictionary.
      - name: Build libjd-engine (wasm)
        working-directory: core
        run: zig build -Dtarget=wasm32-freestanding -Doptimize=fast -Dbuiltin_dict=false --prefix "$RUNNER_TEMP/jd-engine"

      - name: Run dictionary tests (libjd-engine)
        working-directory: bindings/javascript
        run: JD_WASM="$RUNNER_TEMP/jd-engine/bin/jd.wasm" node --test test/dict.test.js

  # Web client: type-check, unit tests (the real engine in Node), the
  # production build, then the end-to-end suite on that build in Chromium,
  # WebKit and Firefox, desktop and phone-sized. The wasm is zig-built here.
  test-web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build libjd (wasm)
        run: npm run wasm

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-results
          path: web/test-results
          if-no-files-found: ignore

  # Rust: the shared bindings crate (FFI contract tests against the real
  # engine, dynamic-linkage dev path) and the CLI's renderer tests.
  test-rust:
    name: rust (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bindings/rust
            cli

      - name: Test bindings/rust
        working-directory: bindings/rust
        run: cargo test

      - name: Test bindings/rust (libjd-engine)
        working-directory: bindings/rust
        run: cargo test --no-default-features

      - name: Test cli
        working-directory: cli
        run: cargo test

  # Rust on Windows: exercises the static jd_static.lib linkage path of the
  # bindings crate, and compiles the TSF crate — the one build this repo's
  # developers can't check on non-Windows machines (embed-resource needs the
  # MSVC resource toolchain).
  test-rust-windows:
    name: rust (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Unlike build-on-push (which hands the Windows jobs a libjd prebuilt on
      # Linux), this job zig-builds the core from source on Windows. The
      # runner image ships git with autocrlf=true, which would rewrite the
      # dictionary tables to CRLF and break the generator's default-LF parse
      # (core/build.zig's -Dtables_eol note) — force an LF checkout.
      - name: Force LF checkout
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bindings/rust
            windows

      - name: Test bindings/rust
        working-directory: bindings/rust
        run: cargo test

      - name: Test windows IME and user-dictionary window
        working-directory: windows
        run: cargo test

  # Java bindings: the JNI shim and the wrapper, built for the runner itself
  # (zig builds libjd, zig cc the shim against the JDK's jni.h) and driven
  # through JUnit on a plain JVM under -Xcheck:jni — no emulator. The Android
  # app ships the same sources (test-android, and the APK builds).
  test-java:
    name: java (jvm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run binding tests
        working-directory: bindings/java
        run: ./gradlew test

  # macOS IME: KeyGate (full NSEvent → KeyAction matrix), engine FFI smoke,
  # and candidate formatting, built with the shared bindings/swift sources.
  test-macos:
    name: macos (xcodebuild)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: macos
        run: xcodegen generate

      - name: Run tests
        working-directory: macos
        run: >
          xcodebuild
          -project JdIME.xcodeproj -scheme JdIME
          -derivedDataPath build
          test

  # iOS keyboard: hostless InputSession dispatch tests on a simulator,
  # built with the shared bindings/swift sources.
  test-ios:
    name: ios (simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        # Device names change across Xcode images; pick the first available
        # iPhone by UDID instead of hardcoding one.
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid')
          test -n "$udid" && test "$udid" != "null"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: ios
        run: >
          xcodebuild
          -project JdIME-iOS.xcodeproj -scheme JdIME-iOS
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build/DD
          test

  # Android: the app's instrumented tests — InputSession dispatch, the user
  # dictionary store, layouts and field policies — against the real engine
  # through JNI on ART. The JNI layer's own tests run on the JVM (test-java).
  test-android:
    name: android (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedAndroidTest

  # The Worker behind ime-jd-repo.hronro.com (cf-worker/worker.js): the
  # update feed and the latest release from its bucket, older releases from
  # GitHub, asked again while GitHub refuses. The package repositories
  # through it are tested end to end in build-on-push.yml.
  test-repo-worker:
    name: repo worker (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the Worker's tests
        run: node --test cf-worker/worker.test.mjs

  # Linux: the Fcitx 5 addon, the IBus engine and the user-dictionary editor,
  # built in the oldest distro the release targets and in the newest, with
  # the shared layer's and the editor's tests, then run end to end in real
  # fcitx5 and ibus-daemon (linux/tests/e2e). Built as the generic tarball
  # is, with the update check, whose updater runs end to end too; the
  # packages, without it, are tested in build-on-push.yml. Each container
  # installs its own toolchain and frameworks; libjd is built once, out here,
  # with Zig.
  test-linux:
    name: linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu 22.04
            image: docker.io/library/ubuntu:22.04
          - distro: arch
            image: docker.io/library/archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build libjd
        run: zig build --build-file core/build.zig -Doptimize=fast -Dtarget=x86_64-linux --prefix "$RUNNER_TEMP/libjd"

      - name: Build, test, and run end to end
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/libjd/lib:/libjd:ro" ${{ matrix.image }} sh -euc '
            /src/linux/scripts/install-deps.sh build test
            meson setup /build /src/linux --prefix=/usr --buildtype=release \
              -Dlibjd=/libjd/libjd.a -Dfcitx5=enabled -Dibus=enabled -Deditor=enabled -Dupdate_check=true
            meson compile -C /build
            meson test -C /build --print-errorlogs
            meson install -C /build --quiet
            /src/linux/tests/e2e/run.sh'
